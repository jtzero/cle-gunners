name: Create Songbook Post

on:
  workflow_dispatch:
    inputs:
      filename:
        description: "Filename / Slug for the post (e.g. bukayo-saka)"
        required: true
        type: string
      title:
        description: "Post Title (Optional if imageAlt provided)"
        required: false
        type: string
      image:
        description: "Image URL (Required, e.g. https://example.com/image.jpg)"
        required: true
        type: string
      imageAlt:
        description: "Image Alt text (Optional if title provided)"
        required: false
        type: string
      imagePlacement:
        description: 'Image placement (Required, e.g. header, body, or JSON: {"all":"header","md":"body"})'
        required: true
        default: "header"
        type: string
      toTheTuneOf:
        description: "Original song"
        required: false
        type: string
      content:
        description: "Post Markdown / Song Lyrics content"
        required: true
        type: string
      songbookSection:
        description: 'Songbook page section title to file the post under (Optional, e.g. "Past Players"; defaults to the main songbook list)'
        required: false
        type: string

jobs:
  create-songbook-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository (act)
        uses: actions/checkout@v6
        if: env.ACT == 'true'

      - name: Checkout repository
        uses: actions/checkout@v6
        if: env.ACT != 'true'
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install &&
          sudo apt-get update &&
          sudo apt-get install -y imagemagick

      - name: Download image & identify image
        id: download-image
        env:
          INPUT_IMAGE_FILENAME: ${{ inputs.filename }}
          INPUT_IMAGE_URL: ${{ inputs.image }}
        run: ./.github/workflows/scripts/download-and-identify-image.sh

      - name: Create Songbook Post
        env:
          INPUT_FILENAME: ${{ inputs.filename }}
          INPUT_TITLE: ${{ inputs.title }}
          INPUT_IMAGE: /${{ steps.download-image.outputs.image-file-name }}
          INPUT_IMAGE_ALT: ${{ inputs.imageAlt }}
          INPUT_IMAGE_PLACEMENT: ${{ inputs.imagePlacement }}
          INPUT_TO_THE_TUNE_OF: ${{ inputs.toTheTuneOf }}
          INPUT_CONTENT: ${{ inputs.content }}
          INPUT_SONGBOOK_SECTION: ${{ inputs.songbookSection }}
        run: npm run create-songbook-post

      - name: Verify generated post and songbook entry
        run: |
          POST_FILE="src/content/posts/${{ inputs.filename }}.md"
          test -f "${POST_FILE}"
          grep -q '^orientation: "\(portrait\|landscape\|square\)"' "${POST_FILE}"
          grep -q "\"${{ inputs.filename }}\"" src/content/pages/songbook.md

      - name: Format generated post
        run: >-
          npx prettier --write
          "src/content/posts/${{ inputs.filename }}.md"
          src/content/pages/songbook.md

      - name: Run unit tests
        run: npm run test:unit

      - name: Log git status
        run: git status

      - name: Create Pull Request
        if: env.ACT != 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "feat(songbook): add songbook post ${{ inputs.filename }}"
          branch: "songbook-post-${{ inputs.filename }}"
          base: "main"
          add-paths: |
            src/content/posts/*
            src/content/pages/songbook.md
            ${{ steps.download-image.outputs.image-path }}
          title: "New Songbook Post: ${{ inputs.title || inputs.filename }}"
          body: |
            This is an automated pull request to create a new songbook post using `imagePost` schema inputs.

            Songbook placement: ${{ inputs.songbookSection && format('section "{0}"', inputs.songbookSection) || 'main posts list' }}
          labels: |
            songbook-post

      #- name: Enable Pull Request Automerge
      #  if: steps.cpr.outputs.pull-request-number != ''
      #  run: |
      #    gh pr merge --rebase --auto "${{ steps.cpr.outputs.pull-request-number }}"
      #  env:
      #    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
